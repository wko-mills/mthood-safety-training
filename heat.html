en: {
  basedOn: "Based on the Mt. Hood Forest Products Heat Illness Prevention Program v1.0 (OAR 437-002-0156). Questions? Contact the Environmental Compliance and Safety Lead.",
  introH: "Welcome — Working Safely in Outdoor Heat",
  introP1: "Heat-related illness can come on fast, and heat stroke can kill. Oregon's heat illness prevention rule protects employees who work where it gets hot — indoors or outdoors — and at Mt. Hood Forest Products that includes the log yard, lumber yard, kiln areas, mobile equipment operation, maintenance work, and any production support task where the heat index climbs.",
  introP2: "The training takes about 15–20 minutes. You must score 80% or better on the final quiz to receive credit. You may retake the quiz if needed.",
  nameLabel: "Enter your full name to begin:",
  namePh: "First and last name",
  startBtn: "Start Training",
  continueBtn: "Continue",
  checkBtn: "Check Answer",
  kcOk: "Correct — well done.",
  kcBad: "Not quite — the correct answer is highlighted. Review it, then continue.",
  secLabel: "Section",
  ofLabel: "of",
  sections: [
    { h:"1. When the Heat Rule Applies", body:
      "<p>Oregon's heat illness prevention rule (OAR 437-002-0156) applies whenever you work — <b>indoors or outdoors</b> — where the <b>heat index</b> reaches <b>80&deg;F or higher</b>.</p>"+
      "<div class='notice'><b>What is the heat index?</b> It is the \"apparent temperature\" — how hot it actually feels when you combine air temperature with humidity. On a humid day the heat index is higher than the number on the thermometer. That is the figure the rule uses, not the plain air temperature.</div>"+
      "<table class='mini'><tr><th>Heat index in your work area</th><th>What applies</th></tr>"+
      "<tr><td><b>At or above 80&deg;F</b></td><td>Shade, drinking water, training, and preventive cool-down rest whenever you need it</td></tr>"+
      "<tr><td><b>At or above 90&deg;F</b></td><td>Everything above <b>plus</b> high-heat practices: a written rest-break schedule, closer observation, and emergency communication</td></tr></table>"+
      "<p>Indoor buildings with a mechanical ventilation system that keeps the heat index below 80&deg;F are not covered. An equipment cab, shed or tent that is not temperature-controlled <b>is</b> covered when the heat index inside it reaches 80&deg;F.</p>"+
      "<div class='notice'><b>Incidental exposure:</b> if you are exposed to the heat 15 minutes or less in any 60-minute period, the rule's requirements do not apply to that hour. Step into the heat briefly, come back to a cool area — that's incidental. Spend more than 15 minutes of an hour in the heat and you are covered.</div>",
      kc:{ q:"Oregon's heat rule is based on the heat index. At what heat index do shade and water requirements begin?", opts:["52&deg;F","80&deg;F","90&deg;F","100&deg;F"], a:1 } },

    { h:"2. What Raises Your Risk", body:
      "<p><b>Environmental factors</b> — the conditions around you — raise the risk of heat-related illness:</p>"+
      "<ul><li>Air temperature and relative humidity</li>"+
      "<li>Radiant heat from the sun, kilns, engines and other hot equipment</li>"+
      "<li>Conductive heat from the ground, decking and machinery</li>"+
      "<li>How much air is moving</li>"+
      "<li>How hard and how long you are working</li>"+
      "<li>The clothing and PPE you are required to wear</li></ul>"+
      "<p><b>Personal factors</b> also matter. These vary from person to person, and this information is for <b>your own personal use</b>:</p>"+
      "<ul><li>Age and physical fitness</li>"+
      "<li>How acclimatized you are to working in heat</li>"+
      "<li>Medical conditions</li>"+
      "<li>How much drinking water you consume</li>"+
      "<li>Alcohol use</li>"+
      "<li>Previous heat-related illness</li>"+
      "<li>Pregnancy</li>"+
      "<li>Medications that affect how your body responds to heat</li></ul>"+
      "<p>If you take a medication and are unsure whether it affects your response to heat, ask your doctor or pharmacist. You are not required to tell your employer about a medical condition or medication.</p>" },

    { h:"3. Drinking Water", body:
      "<p>When the heat index is at or above 80&deg;F, Mt. Hood Forest Products provides enough drinking water for each employee to drink up to <b>one quart (32 oz) per hour</b> of work — cool (66&ndash;77&deg;F) or cold (35&ndash;65&deg;F), at no cost, and readily accessible wherever you are working.</p>"+
      "<ul><li>Drink <b>small amounts often</b> — about a cup every 15–20 minutes — rather than a lot at once</li>"+
      "<li>Don't wait until you feel thirsty. By the time you are thirsty you are already behind</li>"+
      "<li>Portable water containers are positioned close to work areas away from fixed water sources</li></ul>"+
      "<p><b>What counts:</b> potable water, and electrolyte-replenishing sports drinks that do <u>not</u> contain caffeine.</p>"+
      "<div class='notice'><b>What does NOT count:</b> coffee, tea, energy drinks and any other caffeinated beverage do not satisfy the water requirement.</div>",
      kc:{ q:"How much drinking water must be available to each employee per hour when the heat index is at or above 80&deg;F?", opts:["One pint (16 oz)","One quart (32 oz)","One gallon","No set amount"], a:1 } },

    { h:"4. Shade and Cool-Down Rest Periods", body:
      "<p>At a heat index of 80&deg;F or above, shade or other equally effective cooling must be provided — close to where you work, big enough for everyone on a break to sit fully in the shade in a normal posture, and open to the outside air (at least three open sides) or mechanically ventilated. Shade can be trees, canopies, tarps, tents, building overhangs, an air-conditioned cab or a cooled break room. A vehicle sitting in the sun does not count unless it is running with working air conditioning.</p>"+
      "<p>The requirements build as the heat index climbs:</p>"+
      "<div class='tier t1'><div class='tt'>Heat index at or above 80&deg;F</div>"+
      "Water, shade, training — and <b>preventive cool-down rest whenever you feel the need</b>. This rest is paid, and you must never be discouraged or penalized for taking it.</div>"+
      "<div class='tier t2'><div class='tt'>Heat index at or above 90&deg;F — high-heat practices</div>"+
      "Everything above, <b>plus a written heat illness prevention rest-break schedule</b> that gives you paid cool-down rest in the shade, closer observation of all employees, and reliable two-way communication so anyone can reach a supervisor. Mt. Hood Forest Products follows the rest-break schedule set out in its written Heat Illness Prevention Program.</div>"+
      "<p>A heat illness prevention rest break may be taken at the same time as a meal or rest break you already get. Supervisors may also adjust schedules — such as starting earlier in the day — to reduce work performed in the worst of the heat.</p>",
      kc:{ q:"The heat index reaches 92&deg;F. What are you entitled to?", opts:["Nothing until it reaches 100&deg;F","A written, paid cool-down rest-break schedule plus closer observation","Only your normal lunch break","You must stop work entirely"], a:1 } },

    { h:"5. Acclimatization and Close Observation", body:
      "<p><b>Acclimatization</b> is your body's gradual adaptation to working in heat. It develops over <b>7 to 14 days</b> of exposure, with much of the adaptation happening in the first four to five days. It is <b>lost after 7 or more consecutive days</b> away from working in the heat — so after vacation or a stretch of cool weather, you start over.</p>"+
      "<p>Mt. Hood Forest Products closely observes employees when they are:</p>"+
      "<ul><li><b>Newly assigned</b> to work where the heat index reaches 80&deg;F or above</li>"+
      "<li><b>Returning</b> to that work after an absence of 7 days or more</li></ul>"+
      "<p><b>During a sudden heat wave, everyone is closely observed</b> — even fully acclimatized employees — because a sharp jump in the heat index is dangerous for everybody.</p>"+
      "<div class='notice'><b>Important:</b> you <b>cannot build tolerance to the heat during a heat wave</b>. A sudden jump in temperature is dangerous for everybody, no matter how long you have worked outside.</div>"+
      "<p><b>Close observation</b> means someone is checking on you: direct supervisor observation, a mandatory buddy system, or regular radio or phone check-ins if you work alone or in a remote part of the yard.</p>",
      kc:{ q:"You return from a two-week vacation in July. What applies to you?", opts:["Nothing — you already work here","Re-acclimatization and close observation, because acclimatization fades after 7 or more days away","You must retake this training before working","You may not work outdoors for a week"], a:1 } },

    { h:"6. PPE, Clothing and Cooling Yourself", body:
      "<p>The gear that protects you from other hazards also holds heat in. During <b>all rest and meal periods</b>, remove heat-retaining PPE — non-breathable or chemical-resistant clothing, and any other gear that traps heat — so your body can actually cool down. Sitting in the shade in a vapor-barrier suit does very little.</p>"+
      "<ul><li>Wear light-colored, loose, breathable clothing when the job allows it</li>"+
      "<li>Use shade, fans, misting or cool wet cloths on your neck and face during rest</li>"+
      "<li>Take advantage of air-conditioned cabs and cooled break areas</li></ul>"+
      "<div class='notice'>Never remove PPE that is required for a hazard while you are still working — the answer to heat is rest, water, shade and schedule changes, not going unprotected.</div>" },

    { h:"7. Recognizing Heat-Related Illness", body:
      "<p>Learn these signs — in yourself and in the people working around you.</p>"+
      "<table class='mini'><tr><th>Condition</th><th>Signs and symptoms</th><th>What to do</th></tr>"+
      "<tr><td><b>Heat rash</b></td><td>Clusters of red bumps on the skin — neck, upper chest, skin folds</td><td>Keep the area dry; move to a cooler environment</td></tr>"+
      "<tr><td><b>Heat cramps</b></td><td>Muscle cramps or spasms, usually legs or abdomen; heavy sweating</td><td>Move to shade, rest, drink water, stretch gently</td></tr>"+
      "<tr><td><b>Heat exhaustion</b></td><td>Heavy sweating; weakness; cold, pale, clammy skin; fast weak pulse; nausea or vomiting; headache; dizziness; fainting</td><td>Move to shade or air conditioning; loosen clothing; cool wet cloths; sips of water. <b>If vomiting or getting worse — call 911</b></td></tr>"+
      "<tr><td><b>Heat stroke</b><br><span style='color:#C00000'>LIFE THREATENING</span></td><td>Body temperature 104&deg;F or higher; hot red skin, dry or damp; rapid strong pulse; headache; dizziness; nausea; <b>confusion, irritability, slurred speech</b>; seizures; loss of consciousness</td><td><b>CALL 911 IMMEDIATELY</b>; move to shade; cool rapidly with water and ice packs to armpits and groin; do NOT give fluids if unconscious</td></tr></table>"+
      "<div class='danger'><b>Confusion is the red flag.</b> A co-worker who stops making sense, gets combative, or stops sweating in the heat may be having a heat stroke. Do not wait to see if they improve — this is an emergency.</div>",
      kc:{ q:"A co-worker in the yard is confused, combative and has hot, red skin. What is your FIRST action?", opts:["Give them cold water to drink","Call 911 immediately and start cooling them","Have them sit down and watch them for 30 minutes","Drive them home"], a:1 } },

    { h:"8. Reporting and Emergency Response", body:
      "<p><b>Report symptoms immediately</b> — your own or a co-worker's — to your supervisor. Reporting early is what keeps a bad afternoon from becoming an ambulance ride. You will never be disciplined for reporting heat symptoms or for taking a preventive cool-down rest.</p>"+
      "<p>If someone shows signs or symptoms of heat-related illness:</p>"+
      "<ul><li><b>Stop work</b> and move them to shade or a cool environment</li>"+
      "<li>Loosen or remove heavy, heat-retaining clothing and PPE</li>"+
      "<li>Provide cool drinking water if they are conscious and alert</li>"+
      "<li>Cool them actively — fan, spray or sponge with cool water, wet cloths, ice packs to armpits and groin</li>"+
      "<li><b>Stay with them.</b> Never leave an affected employee alone</li>"+
      "<li>If they do not improve quickly, or show confusion, loss of consciousness or any sign of heat stroke — <b>CALL 911 IMMEDIATELY</b></li>"+
      "<li>Make sure EMS can reach the location; if the person is in a remote area of the yard, arrange to move them where an ambulance can get to them</li></ul>"+
      "<p>Mt. Hood Forest Products maintains effective communication — radio, cell phone or direct contact — between employees and supervisors so symptoms can be reported and help summoned quickly.</p>"+
      "<h2>Emergency Numbers</h2>"+
      "<p>Emergency (medical / fire): <span class='phone'>911</span><br>"+
      "Providence Hood River Memorial Hospital Emergency Department: <span class='phone'>(541) 386-3911</span> — 810 12th St, Hood River (24-hour emergency department, nearest ER to the mill)</p>" }
  ],

es: {
  basedOn: "Basado en el Programa de Prevención de Enfermedades por Calor de Mt. Hood Forest Products v1.0 (OAR 437-002-0156). ¿Preguntas? Comuníquese con el Líder de Cumplimiento Ambiental y Seguridad.",
  introH: "Bienvenido — Prevención de Enfermedades por Calor",
  introP1: "Las enfermedades por calor aparecen rápido, y el golpe de calor puede ser mortal. La regla de prevención de enfermedades por calor de Oregon protege a quienes trabajan donde hace calor — adentro o afuera — y en Mt. Hood Forest Products esto incluye el patio de trozas, el patio de madera, las áreas de los hornos, la operación de equipo móvil, el mantenimiento y cualquier tarea de apoyo a la producción donde suba el índice de calor.",
  introP2: "La capacitación toma de 15 a 20 minutos. Debe obtener 80% o más en el examen final para recibir crédito. Puede repetir el examen si es necesario.",
  nameLabel: "Escriba su nombre completo para comenzar:",

  startBtn: "Comenzar la Capacitación",
  continueBtn: "Continuar",
  checkBtn: "Verificar Respuesta",

  kcBad: "No exactamente — la respuesta correcta está resaltada. Revísela y continúe.",
  secLabel: "Sección",
  ofLabel: "de",
  sections: [
    { h:"1. Cuándo Aplica la Regla del Calor", body:
      "<p>La regla de prevención de enfermedades por calor de Oregon (OAR 437-002-0156) aplica siempre que usted trabaje — <b>adentro o afuera</b> — donde el <b>índice de calor</b> alcance <b>80&deg;F o más</b>.</p>"+
      "<div class='notice'><b>¿Qué es el índice de calor?</b> Es la \"temperatura aparente\" — lo caluroso que se siente en realidad al combinar la temperatura del aire con la humedad. En un día húmedo el índice de calor es más alto que el número del termómetro. Esa es la cifra que usa la regla, no la temperatura simple del aire.</div>"+
      "<table class='mini'><tr><th>Índice de calor en su área de trabajo</th><th>Qué aplica</th></tr>"+
      "<tr><td><b>80&deg;F o más</b></td><td>Sombra, agua potable, capacitación y descanso preventivo cuando lo necesite</td></tr>"+
      "<tr><td><b>90&deg;F o más</b></td><td>Todo lo anterior <b>más</b> prácticas de calor alto: un horario escrito de descansos, observación más cercana y comunicación de emergencia</td></tr></table>"+
      "<p>Los edificios interiores con ventilación mecánica que mantiene el índice de calor por debajo de 80&deg;F no están cubiertos. Una cabina de equipo, cobertizo o carpa sin control de temperatura <b>sí</b> está cubierta cuando el índice de calor adentro llega a 80&deg;F.</p>"+
      "<div class='notice'><b>Exposición incidental:</b> si está expuesto al calor 15 minutos o menos en cualquier período de 60 minutos, los requisitos no aplican a esa hora. Entrar al calor un momento y volver a un área fresca es incidental. Pasar más de 15 minutos de una hora en el calor sí está cubierto.</div>",
      kc:{ q:"La regla de calor de Oregon se basa en el índice de calor. ¿A qué índice de calor comienzan los requisitos de sombra y agua?", opts:["52&deg;F","80&deg;F","90&deg;F","100&deg;F"], a:1 } },

    { h:"2. Lo Que Aumenta Su Riesgo", body:
      "<p>Los <b>factores ambientales</b> — las condiciones a su alrededor — aumentan el riesgo de enfermedad por calor:</p>"+

    { h:"5. Aclimatación y Observación Cercana", body:

var ANSWER_KEY = STR.en.quiz.map(function(q){ return q.a; });

/* ------------ State ------------ */
var state = { lang:null, screen:"lang", section:0, name:"", kcDone:{}, quizAnswers:{}, lastScore:null, code:null };

/* ------------ Helpers ------------ */
function T(){ return STR[state.lang]; }
function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

function generateCode(){
  var chars="ABCDEFGHJKMNPQRSTUVWXYZ23456789", out="";
  for(var i=0;i<5;i++){ out+=chars.charAt(Math.floor(Math.random()*chars.length)); }
  return CODE_PREFIX+out;
}
function gradeQuiz(answers){
  var correct=0;
  for(var i=0;i<ANSWER_KEY.length;i++){ if(answers[i]===ANSWER_KEY[i]) correct++; }
  var pct=Math.round(correct/ANSWER_KEY.length*100);
  return { correct:correct, total:ANSWER_KEY.length, pct:pct, pass: pct>=PASS_PCT };
}

/* ------------ Rendering ------------ */
function setLang(l){
  state.lang=l;
  if(state.screen==="lang") state.screen="intro";
  $("langBar").className="langbar";
  $("btnEN").className = l==="en"?"active":"";
  $("btnES").className = l==="es"?"active":"";
  render();
}
function progress(){
  if(state.screen==="lang"){ $("progBar").style.width="0%"; return; }
  var total = T().sections.length + 2;
  var pos = state.screen==="intro"?0 : state.screen==="quiz"?total-1 : state.screen==="pass"||state.screen==="fail"?total : state.section+1;
  $("progBar").style.width = Math.round(pos/total*100)+"%";
}
function renderLang(){
  $("app").innerHTML =
    '<div class="card splash">'+
    '<div class="co">MT. HOOD FOREST PRODUCTS LLC</div>'+
    '<div class="ti-en">Heat Illness Prevention Training</div>'+
    '<div class="ti-es">Capacitación sobre Prevención de Enfermedades por Calor</div>'+
    '<div class="choose">Choose your language / Elija su idioma:</div>'+
    '<div class="langbtns">'+
    '<button id="langBtnEN">English</button>'+
    '<button id="langBtnES">Español</button>'+
    '</div></div>';
  $("langBtnEN").addEventListener("click", function(){ setLang("en"); });
  $("langBtnES").addEventListener("click", function(){ setLang("es"); });
}
function render(){
  progress();
  if(state.screen==="lang") renderLang();
  else if(state.screen==="intro") renderIntro();
  else if(state.screen==="section") renderSection();
  else if(state.screen==="quiz") renderQuiz();
  else if(state.screen==="pass") renderPass();
  else if(state.screen==="fail") renderFail();
}
function renderIntro(){
  var t=T();
  $("app").innerHTML =
    '<div class="card"><h1>'+t.introH+'</h1><p>'+t.introP1+'</p><p>'+t.introP2+'</p>'+
    '<h2>'+t.nameLabel+'</h2>'+
    '<input type="text" id="nameInput" placeholder="'+t.namePh+'" value="'+esc(state.name)+'" autocomplete="name">'+
    '<br><button class="btn" id="startBtn" disabled>'+t.startBtn+'</button>'+
    '<p style="color:var(--gray);font-size:.85em;margin-top:16px">'+t.basedOn+'</p></div>';
  var inp=$("nameInput"), btn=$("startBtn");
  function gate(){ state.name=inp.value.trim(); btn.disabled = state.name.length<2; }
  inp.addEventListener("input", gate); gate();
  btn.addEventListener("click", function(){ if(state.name.length>=2){ state.screen="section"; state.section=0; render(); window.scrollTo(0,0);} });
}
function renderSection(){
  var t=T(), s=t.sections[state.section];
  var html = '<div class="card"><div class="qnum">'+t.secLabel+' '+(state.section+1)+' '+t.ofLabel+' '+t.sections.length+'</div><h1>'+s.h+'</h1>'+s.body;
  var kcPassed = !!state.kcDone[state.section];
  if(s.kc){
    html += '<div class="kc"><div class="kct">✔ '+s.kc.q+'</div>';
    for(var i=0;i<s.kc.opts.length;i++){
      html += '<label class="opt" id="kcOpt'+i+'"><input type="radio" name="kc" value="'+i+'"'+(kcPassed?' disabled':'')+'>'+s.kc.opts[i]+'</label>';
    }
    html += '<div class="fb" id="kcFb"></div>';
    if(!kcPassed) html += '<button class="btn secondary" id="kcCheck">'+t.checkBtn+'</button>';
    html += '</div>';
  }
  html += '<br><button class="btn" id="contBtn"'+((s.kc&&!kcPassed)?' disabled':'')+'>'+t.continueBtn+'</button></div>';
  $("app").innerHTML = html;
  if(s.kc && !kcPassed){
    $("kcCheck").addEventListener("click", function(){
      var sel=document.querySelector('input[name="kc"]:checked');
      if(!sel) return;
      var v=parseInt(sel.value,10), fb=$("kcFb");
      if(v===s.kc.a){
        state.kcDone[state.section]=true;
        $("kcOpt"+v).className="opt correct";
        fb.className="fb ok"; fb.textContent=t.kcOk;
        $("contBtn").disabled=false; $("kcCheck").disabled=true;
      } else {
        $("kcOpt"+v).className="opt wrong";
        $("kcOpt"+s.kc.a).className="opt correct";
        fb.className="fb bad"; fb.textContent=t.kcBad;
        state.kcDone[state.section]=true;
        $("contBtn").disabled=false; $("kcCheck").disabled=true;
      }
    });
  }
  $("contBtn").addEventListener("click", function(){
    if(state.section < t.sections.length-1){ state.section++; } else { state.screen="quiz"; }
    render(); window.scrollTo(0,0);
  });
}
function renderQuiz(){
  var t=T();
  var html='<div class="card"><h1>'+t.quizH+'</h1><p>'+t.quizIntro+'</p>';
  for(var i=0;i<t.quiz.length;i++){
    var q=t.quiz[i];
    html+='<div class="quizq"><div class="qt">'+(i+1)+'. '+q.q+'</div>';
    for(var j=0;j<q.opts.length;j++){
      var checked = state.quizAnswers[i]===j ? ' checked' : '';
      html+='<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"'+checked+'>'+q.opts[j]+'</label>';
    }
    html+='</div>';
  }
  html+='<div class="fb bad" id="quizWarn" style="display:none">'+t.answerAll+'</div>';
  html+='<button class="btn" id="quizSubmit">'+t.submitBtn+'</button></div>';
  $("app").innerHTML=html;
  var radios=document.querySelectorAll('#app input[type=radio]');
  for(var r=0;r<radios.length;r++){
    radios[r].addEventListener("change", function(e){
      var name=e.target.name, idx=parseInt(name.substring(1),10);
      state.quizAnswers[idx]=parseInt(e.target.value,10);
    });
  }
  $("quizSubmit").addEventListener("click", function(){
    var answers=[];
    for(var i=0;i<t.quiz.length;i++){
      if(typeof state.quizAnswers[i]==="undefined"){ $("quizWarn").style.display="block"; return; }
      answers.push(state.quizAnswers[i]);
    }
    var res=gradeQuiz(answers);
    state.lastScore=res;
    if(res.pass){ state.code=generateCode(); state.screen="pass"; }
    else { state.screen="fail"; }
    render(); window.scrollTo(0,0);
  });
}
function fmtDate(){
  var d=new Date();
  var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var mes=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return state.lang==="es" ? d.getDate()+" "+mes[d.getMonth()]+" "+d.getFullYear() : m[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function renderPass(){
  var t=T(), r=state.lastScore;
  $("app").innerHTML =
    '<div class="card"><p class="passmsg">'+t.passH+'</p></div>'+
    '<div class="cert" id="certBox">'+
      '<div>'+t.passSub+'</div>'+
      '<div class="big" id="certName">'+esc(state.name)+'</div>'+
      '<div>'+t.passModule+'</div>'+
      '<div style="margin:8px 0">'+t.scoreLabel+': <b>'+r.correct+'/'+r.total+' ('+r.pct+'%)</b> &nbsp;·&nbsp; '+t.dateLabel+': <b id="certDate">'+fmtDate()+'</b></div>'+
      '<div>'+t.codeLabel+':</div>'+
      '<div class="code" id="certCode">'+state.code+'</div>'+
    '</div>'+
    '<div class="card"><p>'+t.passInstr+'</p>'+
    '<a class="btn" id="recordLink" href="'+FORM_URL+'" target="_blank" rel="noopener">'+t.recordBtn+'</a></div>';
}
function renderFail(){
  var t=T(), r=state.lastScore;
  $("app").innerHTML =
    '<div class="card" id="failBox"><p class="failmsg">'+t.failH+'</p>'+
    '<p>'+t.yourScore+': <b>'+r.correct+'/'+r.total+' ('+r.pct+'%)</b></p>'+
    '<p>'+t.failMsg+'</p>'+
    '<button class="btn secondary" id="reviewBtn">'+t.reviewBtn+'</button> '+
    '<button class="btn" id="retakeBtn">'+t.retakeBtn+'</button></div>';
  $("reviewBtn").addEventListener("click", function(){ state.quizAnswers={}; state.screen="section"; state.section=0; render(); window.scrollTo(0,0); });
  $("retakeBtn").addEventListener("click", function(){ state.quizAnswers={}; state.screen="quiz"; render(); window.scrollTo(0,0); });
}

/* ------------ Test hooks ------------ */
window.APP = { STR:STR, state:state, gradeQuiz:gradeQuiz, generateCode:generateCode, ANSWER_KEY:ANSWER_KEY, FORM_URL:FORM_URL, PASS_PCT:PASS_PCT, MODULE_VERSION:MODULE_VERSION, CODE_PREFIX:CODE_PREFIX, setLang:setLang, render:render };
window.setLang = setLang;

render();
</script>
</body>
</html>
