<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mt. Hood Forest Products — Lockout/Tagout SUPERVISOR Training v1.0</title>
<style>
  :root { --blue:#2E75B6; --dark:#1F4E79; --gray:#666; --light:#F2F2F2;
          --green:#2E8B57; --amber:#E8A317; --orange:#D2691E; --red:#B22222; --maroon:#701C1C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Arial,Helvetica,sans-serif; background:var(--light); color:#222; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:#fff; box-shadow:0 0 24px rgba(0,0,0,.08); }
  header { background:var(--dark); color:#fff; padding:14px 20px; }
  header .co { font-weight:bold; font-size:15px; letter-spacing:.5px; }
  header .prog { font-size:12px; color:#cfe0f0; }
  .badge { display:inline-block; background:var(--amber); color:#2b1c00; font-weight:bold; font-size:11px; letter-spacing:1px; padding:2px 8px; border-radius:999px; margin-top:5px; }
  .bar { height:6px; background:#dce7f2; } .bar span { display:block; height:100%; background:var(--blue); width:0%; transition:width .3s; }
  main { flex:1; padding:24px 20px 32px; }
  h1 { color:var(--dark); font-size:24px; margin-bottom:12px; }
  p { margin-bottom:12px; font-size:16px; }
  ul, ol { margin:0 0 12px 22px; } li { margin-bottom:7px; font-size:16px; }
  .eyebrow { text-transform:uppercase; letter-spacing:1.5px; font-size:11px; color:var(--gray); font-weight:bold; margin-bottom:6px; }
  .card { background:var(--light); border-left:4px solid var(--blue); padding:12px 14px; margin:14px 0; border-radius:0 6px 6px 0; font-size:15px; }
  .card.warn { border-left-color:var(--red); }
  .card.do { border-left-color:var(--green); }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:15px; font-size:17px; font-weight:bold; font-family:inherit; cursor:pointer; margin-top:18px; }
  .btn:active { background:var(--dark); } .btn:disabled { background:#b9c8d6; cursor:default; }
  .btn.secondary { background:#fff; color:var(--blue); border:2px solid var(--blue); }
  a.btn { text-decoration:none; text-align:center; box-sizing:border-box; }
  input[type=text] { width:100%; padding:13px; font-size:17px; font-family:inherit; border:2px solid #c6d4e2; border-radius:8px; margin-top:6px; }
  input[type=text]:focus { outline:none; border-color:var(--blue); }
  label { font-weight:bold; font-size:14px; color:var(--dark); }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid #c6d4e2; border-radius:8px; padding:13px 14px; font-size:16px; font-family:inherit; margin-top:10px; cursor:pointer; }
  .opt.sel { border-color:var(--blue); background:#eaf2fa; }
  .opt.right { border-color:var(--green); background:#e8f5ee; }
  .opt.wrong { border-color:var(--red); background:#fbeaea; }
  .feedback { margin-top:12px; padding:12px 14px; border-radius:8px; font-size:15px; display:none; }
  .feedback.good { background:#e8f5ee; border-left:4px solid var(--green); display:block; }
  .feedback.bad { background:#fbeaea; border-left:4px solid var(--red); display:block; }
  .qnum { font-size:12px; color:var(--gray); font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .cert { border:3px solid var(--dark); border-radius:10px; padding:22px; text-align:center; margin-top:16px; }
  .cert .big { font-size:22px; font-weight:bold; color:var(--dark); margin:8px 0; }
  .cert .code { font-size:26px; letter-spacing:3px; font-weight:bold; color:var(--blue); background:var(--light); border-radius:8px; padding:10px; margin:12px 0; }
  .score-pill { display:inline-block; background:var(--green); color:#fff; border-radius:999px; padding:6px 18px; font-weight:bold; font-size:18px; }
  .score-pill.fail { background:var(--red); }
  .steps { counter-reset:s; list-style:none; margin-left:0; }
  .steps li { counter-increment:s; position:relative; padding-left:34px; margin-bottom:10px; }
  .steps li:before { content:counter(s); position:absolute; left:0; top:1px; background:var(--blue); color:#fff; width:24px; height:24px; border-radius:50%; text-align:center; font-weight:bold; font-size:14px; line-height:24px; }
  table.mini { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; }
  table.mini th { background:var(--blue); color:#fff; padding:8px; text-align:left; }
  table.mini td { border:1px solid #d9e2ec; padding:8px; vertical-align:top; }
  table.mini tr:nth-child(even) td { background:var(--light); }
  footer { padding:12px 20px; font-size:11px; color:var(--gray); text-align:center; border-top:1px solid #e4e9ef; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="co">MT. HOOD FOREST PRODUCTS LLC</div>
    <div class="prog">Lockout/Tagout (LOTO) Training &mdash; 29 CFR 1910.147 / OAR 437-002-0154</div>
    <div class="badge">SUPERVISOR MODULE</div>
  </header>
  <div class="bar"><span id="prog"></span></div>
  <main id="main"></main>
  <footer>Mt. Hood Forest Products LLC · Hood River, OR · Lockout/Tagout Program v2.1 · Supervisor Module v1.0 (2026)</footer>
</div>
<script>
const FORM_URL = "https://forms.cloud.microsoft/r/weC1yEfgb7";
let empName = "", slideIdx = 0, quizIdx = 0, quizScore = 0;
const slides = [{"t": "content", "eyebrow": "Section 1 of 9", "title": "What This Module Does Not Do", "html": "<p>This module carries the <b>knowledge</b> half of authorized-employee training. It does not, by itself, make anyone authorized to lock out anything.</p><div class='card warn'><b>29 CFR 1910.147 (adopted by Oregon under OAR 437-002-0140(7)) requires a periodic inspection at least annually</b> — a person other than the one using the procedure must <b>observe each authorized employee actually performing the lockout</b> on equipment they lock out, and it is certified. A passing quiz score does not discharge that duty.</div><p><b>What you owe as a supervisor:</b></p><ul><li>Ensure the annual observed periodic inspection of each authorized employee is done and certified.</li><li>Where <b>tagout</b> is used, review the limitations of tags with each authorized and affected employee — individually, not just as a group.</li><li>Retrain on job change, equipment change, procedure change, or an observed deviation.</li><li>Authorize emergency lock removal only under the documented procedure.</li><li>Coordinate with outside employers before they service our equipment.</li></ul><p>Oregon also adds an individual-lock requirement (<b>OAR 437-002-0154</b>): the employee who applies a lock holds the only key or is the only one who knows the combination.</p>"}, {"t": "content", "eyebrow": "Section 2 of 9", "title": "The Six Steps, In Order", "html": "<p>Order is not stylistic — each step depends on the one before it.</p><table class='mini'><tr><th>Step</th><th>What it means</th></tr><tr><td><b>1. Prepare</b></td><td>Know every energy type and magnitude, every isolating device and its location, and the hazards. Pull the written procedure — do not work from memory.</td></tr><tr><td><b>2. Notify</b></td><td>Tell affected employees before locks go on.</td></tr><tr><td><b>3. Machine stop</b></td><td>Orderly shutdown using normal controls. <b>Always perform a machine stop before locking out the disconnect</b> — pulling a disconnect under load damages gear and endangers people.</td></tr><tr><td><b>4. Isolate</b></td><td>Operate every energy-isolating device the procedure lists — disconnects, line and quarter-turn valves, blinds.</td></tr><tr><td><b>5. Lock and tag</b></td><td>A personal lock on <b>each</b> device, applied only by the employee doing the work.</td></tr><tr><td><b>6. Dissipate, then VERIFY</b></td><td>Release or restrain stored energy, then prove zero energy before a hand goes in.</td></tr></table><div class='card warn'><b>At the disconnect:</b> stand to one side and look away as you operate it. A push button or selector switch is not an energy-isolating device.</div>"}, {"t": "check", "q": "An authorized employee reaches the disconnect and finds the machine still running. What is correct?", "opts": ["Pull the disconnect — it stops the machine either way", "Perform the machine stop first, then lock out the disconnect", "Lock the disconnect, then hit stop", "Have the operator stop it after isolation"], "a": 1, "why": "Always perform a machine stop before locking out the disconnect. Opening a disconnect under load risks arc flash and equipment damage — and standing in front of it while doing so is how people get burned."}, {"t": "content", "eyebrow": "Section 3 of 9", "title": "Reading the Procedure Sheet", "html": "<p>Every machine center has a written lockout procedure. Each row is one isolation point, and the details on the sheet must match the device before a lock goes on: the <b>panel/circuit identifier, its position, and the description</b>.</p><p><b>Read the lock count first.</b> If the sheet calls for a set number of isolation points and an employee comes back having used fewer, the job was not fully locked out — energy paths remain live.</p><p><b>An \"or\" on a row means either device isolates that circuit</b> — the panel position or its remote — not both; one or the other.</p><div class='card warn'><b>Electrical enclosures:</b> opening panels and resetting buckets is restricted to qualified electricians and personnel the company has trained and qualified for that work.</div>"}, {"t": "check", "q": "A procedure sheet lists 15 isolation points and an employee returns having used 3 locks. What does that tell you?", "opts": ["The job is done efficiently", "The machine is not fully isolated — energy paths remain live", "Three is always enough", "The sheet is wrong"], "a": 1, "why": "The lock count on the sheet is the isolation requirement. Fewer locks than the sheet calls for means the machine is not isolated and can still hurt someone. Read the count first."}, {"t": "content", "eyebrow": "Section 4 of 9", "title": "Verification — The Step That Saves People", "html": "<p>Isolation is an assumption until it is tested. Closing the gap in verification know-how is your job.</p><div class='card warn'>A bucket can be mislabeled and a contactor can weld shut. The lock proves the handle moved; only a test proves the energy is gone.</div><p><b>How to verify, for every device on the sheet:</b></p><table class='mini'><tr><th>Energy</th><th>Verification</th></tr><tr><td>Electrical</td><td>Clear all personnel from hazardous areas, then attempt to start at the named control on the sheet. Return the control to off afterward. Test with a meter where the work requires it.</td></tr><tr><td>Hydraulic / pneumatic</td><td>Bleed or vent after isolating; confirm at the gauge; work the control to prove no movement.</td></tr><tr><td>Gravity</td><td>Block or restrain raised decks, gates, and loads. A lock does not hold up steel.</td></tr><tr><td>Momentum</td><td>Let arbors and flywheels coast to a full stop — confirm by sight, not by clock.</td></tr><tr><td>Stored</td><td>Discharge capacitors, relieve accumulators, release spring tension.</td></tr></table><p>If energy can re-accumulate, verification continues periodically until the work is done.</p>"}, {"t": "content", "eyebrow": "Section 5 of 9", "title": "Individual Locks and Your Lock Alone", "html": "<p>Only the employee who applied a lock may remove it. Oregon's individual-lock rule (<b>OAR 437-002-0154</b>) puts teeth on that: the person who applies a lock must hold the <b>only key</b>, or be the <b>only one</b> who knows the combination. Keys are not shared.</p><div class='card warn'>Removing, bypassing, or tampering with another employee's lock or tag is a serious safety violation and one of the fastest ways to kill a coworker.</div><p>There is exactly one exception — an emergency removal when the applying employee is gone (Section 7), done only by a designated supervisor under a strict procedure.</p>"}, {"t": "check", "q": "Oregon's individual-lock rule (OAR 437-002-0154) requires that the person applying a lock…", "opts": ["Shares the key with the supervisor", "Holds the only key or the only combination", "Uses a numbered lock", "Logs it in a book"], "a": 1, "why": "OAR 437-002-0154 requires the applying employee to have sole control of the lock — the only key or the only combination. That is what makes the lock a guarantee, not a suggestion."}, {"t": "content", "eyebrow": "Section 6 of 9", "title": "Group Lockout and Shift Transfer", "html": "<p><b>Group lockout.</b> Every member gets protection equal to their own personal lock:</p><ul><li>Assign a <b>primary authorized employee</b> with overall responsibility, who knows which members are exposed.</li><li>The primary attaches their device to the group lockout device (hasp or lockbox) when the equipment is de-energized, before any work begins.</li><li>Each member places a <b>personal lock</b> on the group device before starting and removes it only when their own work is finished.</li><li>The primary is the <b>last</b> device off when the job is complete.</li></ul><p><b>More than one group:</b> assign a group coordinator over all groups to maintain continuous protection, plus a primary within each group.</p><p><b>Shift transfer:</b> protection never lapses. The incoming employee's lock goes <b>on before</b> the outgoing employee's comes off, both present, status reviewed between them. If no one is there to receive it, the outgoing lock <b>stays on</b>.</p>"}, {"t": "check", "q": "A crew of six is under a group lockbox. Four have finished and pulled their locks. Production wants the machine.", "opts": ["Start it — most of the crew is clear", "Remove the last two locks and start", "The machine stays locked until the last personal lock and then the primary's device come off", "The primary can authorize a restart"], "a": 2, "why": "Every remaining lock represents a person who may still be exposed. The primary authorized employee is the last device removed, after every member has pulled their own."}, {"t": "content", "eyebrow": "Section 7 of 9", "title": "Emergency Lock Removal — Tightly Bounded", "html": "<p>Only the employee who applied a lock may remove it. The single exception is the documented emergency-removal procedure, and <b>only a supervisor may direct it</b>.</p><table class='mini'><tr><th>Required step</th><th>Detail</th></tr><tr><td>1. Verify absence</td><td>Confirm the authorized employee is not at the facility.</td></tr><tr><td>2. All reasonable contact</td><td>Page, radio, telephone, personal visit — and document the attempts.</td></tr><tr><td>3. Make the equipment safe</td><td>Inspect the work area; confirm it is clear and ready to energize.</td></tr><tr><td>4. Remove under direct supervision</td><td>The removal happens under the authorizing supervisor's direct control.</td></tr><tr><td>5. Inform before return</td><td><b>Mandatory.</b> The owner is told their lock was removed before they resume work at the facility.</td></tr></table><div class='card warn'>Step 5 is the one that gets skipped, and it is the dangerous one. An employee who returns believing their lock is still on will put hands into a live machine.</div>"}, {"t": "content", "eyebrow": "Section 8 of 9", "title": "Contractors and Tagout", "html": "<p>Before outside personnel service our equipment, a two-way exchange is required — and it is your job to make it happen, not assume it did:</p><ul><li><b>Inform</b> the outside employer of our lockout/tagout procedures.</li><li><b>Obtain</b> their procedures from them.</li><li><b>Confirm</b> that employees on both sides understand and will follow the other employer's restrictions.</li></ul><p>When our employees and contractor employees work the same equipment, <b>group lockout applies across both</b> — their people put personal locks on the group device the same as ours. Document the exchange: who, when, what was covered.</p><p><b>Tagout-only situations:</b> where a device genuinely cannot accept a lock, tagout requires additional safeguards — removing an isolating circuit element, blocking a controlling switch, opening an extra disconnect, or removing a valve handle — plus training on the limitations of tags, including that <b>a tag can evoke a false sense of security</b>.</p>"}, {"t": "check", "q": "A contractor millwright arrives to work on the resaw and says his company has its own LOTO program.", "opts": ["Good — his program covers it", "Ours governs; his is irrelevant", "Exchange procedures both ways, confirm both crews understand the other's restrictions, and document it", "Have him use our locks only"], "a": 2, "why": "The rule requires a two-way exchange and confirmation that both employers' employees understand and will follow the restrictions. Where both crews work the same equipment, group lockout spans both."}, {"t": "content", "eyebrow": "Section 9 of 9", "title": "What You Watch For on the Floor", "html": "<p>Most lockout failures look ordinary right up until they do not. What to correct on sight:</p><table class='mini'><tr><th>What you see</th><th>Why it matters</th></tr><tr><td>Fewer locks than the sheet calls for</td><td>The machine is not isolated. Energy paths remain live.</td></tr><tr><td>\"I'll just be a second\" at a jam</td><td>Unjamming is service work. Reaching past a guard requires lockout.</td></tr><tr><td>Stop button used instead of the disconnect</td><td>A control device is not an energy-isolating device.</td></tr><tr><td>Skipping the start-test because \"it's obviously dead\"</td><td>Buckets are mislabeled and contactors weld. Verification is the point.</td></tr><tr><td>One person carrying a coworker's lock</td><td>Breaks the entire system. Locks are personal and never transferred.</td></tr><tr><td>An orphan lock nobody claims</td><td>Someone may be exposed. Investigate; never cut it casually.</td></tr></table><p>Deviations trigger retraining. Document what you do: periodic inspections (machine, date, employees, inspector), retraining, contractor coordination, and any emergency lock removal. Records are kept at least three years.</p>"}, {"t": "check", "q": "Your annual periodic inspection of an authorized employee is best satisfied by:", "opts": ["Confirming they passed this module", "A signed acknowledgement form", "Observing them perform an actual lockout on equipment they lock out, and certifying it", "A toolbox talk covering the six steps"], "a": 2, "why": "1910.147 requires a periodic inspection performed by someone other than the user of the procedure, including observation of the procedure in use. A module score is knowledge, not demonstrated performance."}];
const quiz = [{"q": "Completing this module makes an employee authorized to lock out equipment.", "opts": ["False — the annual observed periodic inspection is still required and cannot be discharged by a module", "True — the quiz is the qualification", "True, if they score 100%", "Only for equipment in their own department"], "a": 0}, {"q": "Before locking out a disconnect, the authorized employee must first:", "opts": ["Tag the control panel", "Notify the safety manager", "Perform a machine stop", "Test with a meter"], "a": 2}, {"q": "When operating a disconnect, the correct position is:", "opts": ["Directly in front, for leverage", "To one side, looking away", "Kneeling below the panel", "Any position, if gloved"], "a": 1}, {"q": "Oregon's individual-lock rule (OAR 437-002-0154) requires the person applying a lock to:", "opts": ["Share the key with the supervisor", "Log it in a book", "Use a numbered lock", "Hold the only key or the only combination"], "a": 3}, {"q": "A procedure row reading \"8A or 8Aa\" means:", "opts": ["Either the panel position or its remote isolates that circuit", "Both must be locked", "8Aa is a spare", "The bucket is out of service"], "a": 0}, {"q": "Electrical verification of zero energy is accomplished by:", "opts": ["Confirming the lock is seated", "Clearing personnel, then attempting to start at the named control, and returning it to off", "Waiting five minutes", "Checking the sticker description"], "a": 1}, {"q": "In a group lockout, the primary authorized employee:", "opts": ["Removes their device last, after all personal locks are off", "Holds every key", "Locks out on behalf of the crew", "Is chosen by the crew each shift"], "a": 0}, {"q": "During shift transfer, protection is maintained by:", "opts": ["Leaving the outgoing lock until the next break", "A written note at the panel", "The incoming lock going on before the outgoing lock comes off, both present", "Supervisor sign-off"], "a": 2}, {"q": "The mandatory final step of emergency lock removal is:", "opts": ["Filing an incident report", "Informing the owner their lock was removed before they resume work", "Replacing the lock", "Notifying the shift crew"], "a": 1}, {"q": "Before a contractor services our equipment, you must:", "opts": ["Get their certificate of insurance", "Have them use our locks", "A two-way exchange of lockout procedures and confirmation both crews will follow the restrictions", "A signed waiver"], "a": 2}];
const main = document.getElementById('main');
const progEl = document.getElementById('prog');
const totalSteps = slides.length + quiz.length + 2;
function setProg(n){ progEl.style.width = Math.min(100, Math.round(n/totalSteps*100)) + '%'; }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showStart(){
  setProg(0);
  main.innerHTML = `
    <div class="eyebrow">Mt. Hood Forest Products LLC · Safety Department</div>
    <h1>Lockout/Tagout — Supervisor Training</h1>
    <p>Required supervisor training under 29 CFR 1910.147 (adopted by Oregon OSHA; OAR 437-002-0154, Individual Locks) and the Mt. Hood Forest Products Lockout/Tagout Program v2.1. About 15 minutes.</p>
    <div class="card warn"><b>Complete the employee Lockout/Tagout module first.</b> This module covers your additional duties as a supervisor — it does not replace the employee training, and both are required of you.</div>
    <div class="card">Pass the 10-question quiz with <b>80% or better</b> to finish. You'll get a completion code and a button to record it.</div>
    <label for="nm">Enter your full name to begin</label>
    <input type="text" id="nm" autocomplete="name" placeholder="First and last name">
    <button class="btn" id="startBtn" disabled>Start Supervisor Training</button>`;
  const nm=document.getElementById('nm'), b=document.getElementById('startBtn');
  nm.addEventListener('input', ()=>{ b.disabled = nm.value.trim().split(/\s+/).length < 2; });
  b.addEventListener('click', ()=>{ empName=nm.value.trim(); slideIdx=0; showSlide(); });
}
function showSlide(){
  if (slideIdx >= slides.length){ quizIdx=0; quizScore=0; showQuizIntro(); return; }
  setProg(1+slideIdx);
  const s = slides[slideIdx];
  if (s.t === 'content'){
    main.innerHTML = `<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1>${s.html}
      <button class="btn" id="nextBtn">Continue</button>`;
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  } else {
    main.innerHTML = `<div class="eyebrow">Knowledge Check</div><h1>Quick Question</h1><p><b>${esc(s.q)}</b></p>
      <div id="opts"></div><div class="feedback" id="fb"></div>
      <button class="btn" id="nextBtn" style="display:none">Continue</button>`;
    const optsEl=document.getElementById('opts');
    s.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt'; b.textContent=o;
      b.addEventListener('click', ()=>{
        const fb=document.getElementById('fb');
        [...optsEl.children].forEach(c=>c.disabled=true);
        if (i===s.a){ b.classList.add('right'); fb.className='feedback good'; fb.textContent=s.why;
          document.getElementById('nextBtn').style.display='block'; }
        else { b.classList.add('wrong'); fb.className='feedback bad'; fb.textContent='Not quite — take another look and try again.';
          setTimeout(()=>{ [...optsEl.children].forEach(c=>{c.disabled=false;c.classList.remove('wrong');}); fb.className='feedback'; },1600); }
      });
      optsEl.appendChild(b);
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  }
}
function showQuizIntro(){
  setProg(1+slides.length);
  main.innerHTML = `<div class="eyebrow">Final Quiz</div>
    <h1>Ready, ${esc(empName.split(' ')[0])}?</h1>
    <p>10 questions. You need <b>8 correct (80%)</b> to pass. If you don't pass, review the material and retake it.</p>
    <button class="btn" id="goBtn">Begin Quiz</button>
    <button class="btn secondary" id="revBtn">Review Material First</button>`;
  document.getElementById('goBtn').addEventListener('click', ()=>{ showQuizQ(); window.scrollTo(0,0); });
  document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
}
function showQuizQ(){
  if (quizIdx >= quiz.length){ showResult(); return; }
  setProg(1+slides.length+quizIdx);
  const qq = quiz[quizIdx];
  main.innerHTML = `<div class="qnum">Question ${quizIdx+1} of ${quiz.length}</div>
    <h1 style="font-size:20px">${esc(qq.q)}</h1><div id="opts"></div>
    <button class="btn" id="subBtn" disabled>Submit Answer</button>`;
  const optsEl=document.getElementById('opts');
  let sel=-1;
  qq.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o;
    b.addEventListener('click', ()=>{ sel=i; [...optsEl.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel');
      document.getElementById('subBtn').disabled=false; });
    optsEl.appendChild(b);
  });
  document.getElementById('subBtn').addEventListener('click', ()=>{
    if (sel===qq.a) quizScore++;
    quizIdx++; showQuizQ(); window.scrollTo(0,0);
  });
}
function completionCode(){
  const d=new Date();
  const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  let h=0; const src=empName.toUpperCase()+ds+quizScore+'SUP';
  for (let i=0;i<src.length;i++){ h=((h<<5)-h+src.charCodeAt(i))|0; }
  const alpha="BCDFGHJKMNPQRSTVWXYZ23456789";
  let n=Math.abs(h), out="";
  for (let i=0;i<5;i++){ out+=alpha.charAt(n%alpha.length); n=Math.floor(n/alpha.length); }
  return 'LO26S-' + out;
}
function showResult(){
  setProg(totalSteps);
  const pct = Math.round(quizScore/quiz.length*100);
  const passed = pct >= 80;
  const dateStr = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  if (passed){
    main.innerHTML = `<div class="eyebrow">Training Complete</div><h1>Congratulations!</h1>
      <p style="text-align:center"><span class="score-pill">Score: ${pct}%</span></p>
      <div class="cert">
        <div class="eyebrow">Certificate of Completion</div>
        <div class="big">${esc(empName)}</div>
        <p>has completed <b>Lockout/Tagout SUPERVISOR Training</b><br>per 29 CFR 1910.147 / OAR 437-002-0154</p>
        <p><b>${dateStr}</b> · Score: <b>${quizScore}/${quiz.length} (${pct}%)</b></p>
        <div class="code">${completionCode()}</div>
        <p style="font-size:13px;color:var(--gray)">Mt. Hood Forest Products LLC · Hood River, OR</p>
      </div>
      <div class="card"><b>Final step — record your completion:</b> Tap the button below to open the completion form. Select the module <b>Lockout/Tagout (LOTO) — Supervisor / Bloqueo y Etiquetado — Supervisor</b>, enter today's date, your score, and the completion code above, then submit. Screenshot this screen for your own records. Your training is not documented until the form is submitted.</div>
      <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Record My Completion</a>`;
  } else {
    main.innerHTML = `<div class="eyebrow">Quiz Result</div><h1>Not Quite — Let's Try Again</h1>
      <p style="text-align:center"><span class="score-pill fail">Score: ${pct}%</span></p>
      <p>You need 80% to pass. Review the material and take the quiz again — your crew is counting on you knowing this cold.</p>
      <button class="btn" id="revBtn">Review Material</button>
      <button class="btn secondary" id="retryBtn">Retake Quiz Now</button>`;
    document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
    document.getElementById('retryBtn').addEventListener('click', ()=>{ quizIdx=0; quizScore=0; showQuizQ(); window.scrollTo(0,0); });
  }
}
window.APP = { slides, quiz, FORM_URL, completionCode, showStart,
  get state(){ return { empName, slideIdx, quizIdx, quizScore }; },
  setName(n){ empName = n; }, setScore(s){ quizScore = s; },
  showResult, showSlide, showQuizQ, showQuizIntro };
showStart();
</script>
</body>
</html>
