<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mt. Hood Forest Products — Wildfire Smoke SUPERVISOR Training v1.0</title>
<style>
  :root { --blue:#2E75B6; --dark:#1F4E79; --gray:#666; --light:#F2F2F2;
          --green:#2E8B57; --amber:#E8A317; --orange:#D2691E; --red:#B22222; --maroon:#701C1C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Arial,Helvetica,sans-serif; background:var(--light); color:#222; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:#fff; box-shadow:0 0 24px rgba(0,0,0,.08); }
  header { background:var(--dark); color:#fff; padding:14px 20px; }
  header .co { font-weight:bold; font-size:15px; letter-spacing:.5px; }
  header .prog { font-size:12px; color:#cfe0f0; }
  .badge { display:inline-block; background:var(--amber); color:#2b1c00; font-weight:bold; font-size:11px; letter-spacing:1px; padding:2px 8px; border-radius:999px; margin-top:5px; }
  .bar { height:6px; background:#dce7f2; } .bar span { display:block; height:100%; background:var(--blue); width:0%; transition:width .3s; }
  main { flex:1; padding:24px 20px 32px; }
  h1 { color:var(--dark); font-size:24px; margin-bottom:12px; }
  p { margin-bottom:12px; font-size:16px; }
  ul, ol { margin:0 0 12px 22px; } li { margin-bottom:7px; font-size:16px; }
  .eyebrow { text-transform:uppercase; letter-spacing:1.5px; font-size:11px; color:var(--gray); font-weight:bold; margin-bottom:6px; }
  .card { background:var(--light); border-left:4px solid var(--blue); padding:12px 14px; margin:14px 0; border-radius:0 6px 6px 0; font-size:15px; }
  .card.warn { border-left-color:var(--red); }
  .card.do { border-left-color:var(--green); }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:15px; font-size:17px; font-weight:bold; font-family:inherit; cursor:pointer; margin-top:18px; }
  .btn:active { background:var(--dark); } .btn:disabled { background:#b9c8d6; cursor:default; }
  .btn.secondary { background:#fff; color:var(--blue); border:2px solid var(--blue); }
  a.btn { text-decoration:none; text-align:center; box-sizing:border-box; }
  input[type=text] { width:100%; padding:13px; font-size:17px; font-family:inherit; border:2px solid #c6d4e2; border-radius:8px; margin-top:6px; }
  input[type=text]:focus { outline:none; border-color:var(--blue); }
  label { font-weight:bold; font-size:14px; color:var(--dark); }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid #c6d4e2; border-radius:8px; padding:13px 14px; font-size:16px; font-family:inherit; margin-top:10px; cursor:pointer; }
  .opt.sel { border-color:var(--blue); background:#eaf2fa; }
  .opt.right { border-color:var(--green); background:#e8f5ee; }
  .opt.wrong { border-color:var(--red); background:#fbeaea; }
  .feedback { margin-top:12px; padding:12px 14px; border-radius:8px; font-size:15px; display:none; }
  .feedback.good { background:#e8f5ee; border-left:4px solid var(--green); display:block; }
  .feedback.bad { background:#fbeaea; border-left:4px solid var(--red); display:block; }
  .qnum { font-size:12px; color:var(--gray); font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .cert { border:3px solid var(--dark); border-radius:10px; padding:22px; text-align:center; margin-top:16px; }
  .cert .big { font-size:22px; font-weight:bold; color:var(--dark); margin:8px 0; }
  .cert .code { font-size:26px; letter-spacing:3px; font-weight:bold; color:var(--blue); background:var(--light); border-radius:8px; padding:10px; margin:12px 0; }
  .score-pill { display:inline-block; background:var(--green); color:#fff; border-radius:999px; padding:6px 18px; font-weight:bold; font-size:18px; }
  .score-pill.fail { background:var(--red); }
  .steps { counter-reset:s; list-style:none; margin-left:0; }
  .steps li { counter-increment:s; position:relative; padding-left:34px; margin-bottom:10px; }
  .steps li:before { content:counter(s); position:absolute; left:0; top:1px; background:var(--blue); color:#fff; width:24px; height:24px; border-radius:50%; text-align:center; font-weight:bold; font-size:14px; line-height:24px; }
  table.mini { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; }
  table.mini th { background:var(--blue); color:#fff; padding:8px; text-align:left; }
  table.mini td { border:1px solid #d9e2ec; padding:8px; vertical-align:top; }
  table.mini tr:nth-child(even) td { background:var(--light); }
  footer { padding:12px 20px; font-size:11px; color:var(--gray); text-align:center; border-top:1px solid #e4e9ef; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="co">MT. HOOD FOREST PRODUCTS LLC</div>
    <div class="prog">Wildfire Smoke Training &mdash; OAR 437-002-1081</div>
    <div class="badge">SUPERVISOR MODULE</div>
  </header>
  <div class="bar"><span id="prog"></span></div>
  <main id="main"></main>
  <footer>Mt. Hood Forest Products LLC · Hood River, OR · Wildfire Smoke Program v2.2 · Supervisor Module v1.0 (2026)</footer>
</div>
<script>
const FORM_URL = "https://forms.cloud.microsoft/r/weC1yEfgb7";
let empName = "", slideIdx = 0, quizIdx = 0, quizScore = 0;
const slides = [{"t": "content", "eyebrow": "Section 1 of 8", "title": "Why Supervisors Get Extra Training", "html": "<p>Oregon's wildfire smoke rule requires <b>supervisors to receive additional training beyond employees</b> (OAR 437-002-1081). When smoke rolls in, you are the one who checks the air, makes the call, and takes care of your crew.</p><p>Your training must cover the procedures to implement the rule, what to do if an employee shows symptoms of smoke exposure, and how to move or transport an employee to medical care if needed.</p><div class='card warn'><b>This module does not replace the employee training.</b> You must complete the employee Wildfire Smoke module as well — it covers health effects, symptoms, and respirator use. This module covers your duties on top of that.</div>"}, {"t": "content", "eyebrow": "Section 2 of 8", "title": "Duty 1 — Check the Air", "html": "<p>Air quality is reported two ways — <b>AQI</b> (the public 0–500+ scale) and <b>PM2.5</b> (µg/m³, the concentration the rule is written around). Oregon's rule first applies at <b>AQI 101 (PM2.5 35.5 µg/m³)</b>.</p><p><b>Approved ways to assess the air</b> (Oregon):</p><ul><li>The <b>Oregon DEQ</b> air quality website and monitors</li><li>Local air quality / health advisories</li><li>Direct measurement with a particulate monitor on site</li><li>The <b>5-3-1 Visibility Index</b> — look for known landmarks at 5, 3, and 1 miles; the fewer you can see, the worse the air</li></ul><p><b>How often:</b> assess at the <b>start of each shift</b>, and again as conditions change. If employees report worsening smoke or symptoms, re-check.</p><div class='card do'><b>Write it down.</b> Time, reading, and what you did. It is the record that shows protections were in place when they were required.</div>"}, {"t": "check", "q": "At what air quality does Oregon's wildfire smoke rule first apply, and how do you assess it?", "opts": ["AQI 50; a weather app once a day", "AQI 101 (PM2.5 35.5); Oregon DEQ, advisories, direct measurement, or the 5-3-1 Visibility Index, each shift and as needed", "Whatever looks right; when you remember", "AQI 500; only after a fire is reported"], "a": 1, "why": "Oregon's rule (OAR 437-002-1081) applies at AQI 101 / PM2.5 35.5 µg/m³. Approved methods are the Oregon DEQ, local advisories, direct measurement, or the 5-3-1 Visibility Index — checked at the start of each shift and again as conditions change."}, {"t": "content", "eyebrow": "Section 3 of 8", "title": "Duty 2 — Implement the Right Level", "html": "<p>Oregon builds protections in <b>three steps</b>. Match what YOU do to the air quality:</p><table class='mini'><tr><th>Air quality</th><th>What you do</th></tr><tr><td><b>AQI 101–276</b><br>(PM2.5 35.5+)</td><td>The rule applies: assess the air, verify training, keep two-way communication open, use feasible exposure controls, and <b>provide N95 respirators for voluntary use</b> at no cost — encourage use.</td></tr><tr><td><b>AQI 277–848</b><br>(PM2.5 200.9+)</td><td>Everything above PLUS <b>respirator use becomes REQUIRED</b>, under the Wildfire Smoke Respiratory Protection Program.</td></tr><tr><td><b>AQI 849+</b><br>(PM2.5 500.4+)</td><td>Everything above PLUS a <b>full Respiratory Protection Program</b> under 29 CFR 1910.134: medical evaluation, fit testing, and formal training.</td></tr></table><div class='card warn'><b>Only trained employees work outdoors when the rule is in effect.</b> If someone hasn't completed wildfire smoke training, they don't work in it until they have.</div>"}, {"t": "check", "q": "PM2.5 reaches AQI 277 for outdoor work. N95s are stocked and you told everyone. Is that enough?", "opts": ["Yes — they know where they are", "No — at AQI 277 (PM2.5 200.9) respirator use is REQUIRED, not just available, under the wildfire respiratory program", "Yes, if you announced it twice", "No — you must send everyone home"], "a": 1, "why": "Between AQI 101 and 276 the N95 is voluntary. At AQI 277 and above (PM2.5 200.9+), respirator use becomes required under the Wildfire Smoke Respiratory Protection Program — availability is no longer enough."}, {"t": "content", "eyebrow": "Section 4 of 8", "title": "Duty 3 — Tell the Crew", "html": "<p>The rule requires a <b>two-way</b> hazard-communication system: you tell them the conditions, and they can tell you about hazards and symptoms without fear of reprisal.</p><ul><li>Announce the current level at the <b>crew safety meeting at shift start</b> during smoke events</li><li><b>Post updates</b> at break rooms and time clocks</li><li>Update by <b>radio or verbally</b> during the shift when conditions change</li><li>Answer any employee who asks what the current AQI / PM2.5 is</li></ul><div class='card'>Tell them the number <b>and</b> what it means — which protections are now in effect and what's available. \"It's AQI 150 today, N95s are in the break room and we're moving sorting indoors after lunch\" beats reciting a number.</div>"}, {"t": "content", "eyebrow": "Section 5 of 8", "title": "Duty 4 — Respond to Symptoms", "html": "<p>Watch for burning or watering eyes, coughing, wheezing, shortness of breath, chest tightness, headache, or dizziness — and take any report seriously, even on a day the number looks fine.</p><p><b>When an employee reports symptoms:</b></p><ol class='steps'><li><b>Move them to clean air</b> — an enclosed building with filtered air, or an enclosed filtered cab.</li><li><b>Let them rest and monitor them.</b> Don't leave them alone to \"shake it off.\"</li><li><b>Ask whether they need medical attention</b>, and let them follow any medical advice they already have for a condition like asthma.</li><li><b>If symptoms persist or worsen — get them medical care.</b> Don't wait it out.</li><li><b>Report it</b> to the safety manager and document what happened.</li></ol><div class='card warn'><b>Chest pain, trouble breathing, or a fast/irregular heartbeat are emergencies — call 911.</b> And never retaliate: no discipline, no lost hours for reporting symptoms or seeking care. That is a protected right under the rule.</div>"}, {"t": "check", "q": "An employee on the log deck is struggling to breathe and seems confused. What do you do first?", "opts": ["Drive them to the hospital yourself", "Call 911", "Have them sit down and finish the shift", "Send them home to rest"], "a": 1, "why": "Severe difficulty breathing or confusion is an emergency — call 911. Non-emergency symptoms are handled by moving the employee to clean, filtered air and monitoring them."}, {"t": "content", "eyebrow": "Section 6 of 8", "title": "Duty 5 — Controls and Clean-Air Spaces", "html": "<p>Respirators are one layer, not the only one. Reduce exposure with <b>controls</b>, roughly in this order:</p><ul><li><b>Cleaner-air spaces</b> — enclosed buildings or equipment cabs with working air filtration, kept closed. (These filtered, closed spaces are actually exempt from the rule, because the air inside is clean.)</li><li><b>Schedule and workload changes</b> — shift heavy work to cleaner-air times, rotate people out of the worst of it, add breaks in clean air</li><li><b>Relocate work</b> indoors or to a less-smoky area when practical</li><li><b>Respirators</b> — voluntary, then required, as the AQI climbs</li></ul><div class='card warn'>An enclosed cab or building only counts as clean air if it has <b>working air filtration and the windows and doors are kept closed</b>. A cab with the window down in heavy smoke is not protection.</div>"}, {"t": "content", "eyebrow": "Section 7 of 8", "title": "Duty 6 — Getting Medical Care", "html": "<p><b>Emergency — severe difficulty breathing, chest pain, confusion, loss of consciousness:</b></p><div class='card warn'><b>Call 911 immediately.</b> Do not drive someone in serious distress yourself.</div><p><b>Non-emergency evaluation:</b> nearest ER is Providence Hood River Memorial Hospital, (541) 386-3911. <b>Transporting an employee:</b> arrange a ride — do not have a symptomatic employee drive themselves. Notify the safety manager, and make sure someone knows where they went and follows up.</p><p>Move a symptomatic employee to clean, filtered air first; if that location cannot be reached by EMS, arrange to move them to where an ambulance can, keeping them in clean air on the way.</p>"}, {"t": "content", "eyebrow": "Section 8 of 8", "title": "Duty 7 — Records and Before Fire Season", "html": "<p><b>Document three things:</b> your air-quality checks (time, reading, action); symptom reports and what you did (who, when, symptoms, action, outcome — to the safety manager); and paper training completions.</p><p><b>Paper-path employees:</b> grade the written test against the Supervisor Answer Key (8 of 10 passes); below 8, they review and retake — don't record a failing attempt; sign and date the \"Graded By\" line; submit the completion form on their behalf; and file or scan the graded test.</p><div class='card warn'>Never hand the answer key to an employee. Employees who take the online module record their own completion — the module gives them a button after they pass. You only submit the form for paper tests.</div><p><b>Before each fire season:</b> confirm every outdoor employee has current wildfire smoke training; check N95/KN95 stock is on hand and accessible; know which work areas can move indoors or to filtered cabs and which can't; and know where your clean-air break locations are.</p>"}, {"t": "check", "q": "After you grade an employee's paper wildfire-smoke test and they pass, you must:", "opts": ["Give them the answer key", "Submit the completion form on their behalf and file the graded test", "Nothing — it records itself", "Wait until the end of the year"], "a": 1, "why": "For paper tests, the supervisor grades against the answer key, signs the Graded By line, submits the completion form on the employee's behalf, and files the graded test. Online-module takers record their own completion; the answer key never goes to an employee."}];
const quiz = [{"q": "Supervisor wildfire-smoke training is required in addition to employee training because supervisors must know:", "opts": ["Only how to read a monitor", "The procedures to implement the rule, how to respond to symptoms, and how to arrange medical transport", "Nothing extra — it's the same training", "How to file workers' comp claims"], "a": 1}, {"q": "Oregon's wildfire smoke rule (OAR 437-002-1081) first applies at:", "opts": ["AQI 50", "AQI 277", "AQI 101 (PM2.5 35.5 µg/m³)", "AQI 500"], "a": 2}, {"q": "At what air quality does respirator use become REQUIRED (not just voluntary)?", "opts": ["AQI 277 (PM2.5 200.9)", "AQI 101", "It is never required", "AQI 50"], "a": 0}, {"q": "At AQI 849+ (PM2.5 500.4+), what applies?", "opts": ["Voluntary N95s only", "Nothing beyond AQI 277", "Send everyone home only", "A full Respiratory Protection Program under 1910.134 — medical evaluation, fit testing, training"], "a": 3}, {"q": "Which is an approved way to assess air quality in Oregon?", "opts": ["Guessing by the sunset color", "Asking how a coworker feels", "The Oregon DEQ website, advisories, direct measurement, or the 5-3-1 Visibility Index", "Only a weather forecast"], "a": 2}, {"q": "How often do you assess the air quality?", "opts": ["Once a season", "At the start of each shift, and again as conditions change", "Only when someone complains", "Weekly"], "a": 1}, {"q": "An employee reports coughing and chest tightness. Your FIRST step is to:", "opts": ["Move them to a clean, filtered-air environment and monitor them", "Tell them to finish the task", "Write them up for slowing production", "Wait until break"], "a": 0}, {"q": "An employee has severe difficulty breathing and appears confused. You should:", "opts": ["Drive them to the hospital yourself", "Have them rest in the truck", "Send them home alone", "Call 911 immediately"], "a": 3}, {"q": "If an employee reports symptoms or seeks medical attention for smoke, you may:", "opts": ["Dock their hours", "Discipline them for leaving", "Never retaliate — it is a protected right", "Require a doctor's note before they report"], "a": 2}, {"q": "An equipment cab counts as a clean-air space only if:", "opts": ["It has a good radio", "It has working air filtration and windows/doors are kept closed", "It is parked uphill", "It is a new model"], "a": 1}];
const main = document.getElementById('main');
const progEl = document.getElementById('prog');
const totalSteps = slides.length + quiz.length + 2;
function setProg(n){ progEl.style.width = Math.min(100, Math.round(n/totalSteps*100)) + '%'; }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showStart(){
  setProg(0);
  main.innerHTML = `
    <div class="eyebrow">Mt. Hood Forest Products LLC · Safety Department</div>
    <h1>Wildfire Smoke — Supervisor Training</h1>
    <p>Required annual supervisor training under OAR 437-002-1081 (Oregon OSHA's Protection from Wildfire Smoke rule) and the Mt. Hood Forest Products Wildfire Smoke Program v2.2. About 15 minutes.</p>
    <div class="card warn"><b>Complete the employee Wildfire Smoke module first.</b> This module covers your additional duties as a supervisor — it does not replace the employee training, and both are required of you.</div>
    <div class="card">Pass the 10-question quiz with <b>80% or better</b> to finish. You'll get a completion code and a button to record it.</div>
    <label for="nm">Enter your full name to begin</label>
    <input type="text" id="nm" autocomplete="name" placeholder="First and last name">
    <button class="btn" id="startBtn" disabled>Start Supervisor Training</button>`;
  const nm=document.getElementById('nm'), b=document.getElementById('startBtn');
  nm.addEventListener('input', ()=>{ b.disabled = nm.value.trim().split(/\s+/).length < 2; });
  b.addEventListener('click', ()=>{ empName=nm.value.trim(); slideIdx=0; showSlide(); });
}
function showSlide(){
  if (slideIdx >= slides.length){ quizIdx=0; quizScore=0; showQuizIntro(); return; }
  setProg(1+slideIdx);
  const s = slides[slideIdx];
  if (s.t === 'content'){
    main.innerHTML = `<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1>${s.html}
      <button class="btn" id="nextBtn">Continue</button>`;
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  } else {
    main.innerHTML = `<div class="eyebrow">Knowledge Check</div><h1>Quick Question</h1><p><b>${esc(s.q)}</b></p>
      <div id="opts"></div><div class="feedback" id="fb"></div>
      <button class="btn" id="nextBtn" style="display:none">Continue</button>`;
    const optsEl=document.getElementById('opts');
    s.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt'; b.textContent=o;
      b.addEventListener('click', ()=>{
        const fb=document.getElementById('fb');
        [...optsEl.children].forEach(c=>c.disabled=true);
        if (i===s.a){ b.classList.add('right'); fb.className='feedback good'; fb.textContent=s.why;
          document.getElementById('nextBtn').style.display='block'; }
        else { b.classList.add('wrong'); fb.className='feedback bad'; fb.textContent='Not quite — take another look and try again.';
          setTimeout(()=>{ [...optsEl.children].forEach(c=>{c.disabled=false;c.classList.remove('wrong');}); fb.className='feedback'; },1600); }
      });
      optsEl.appendChild(b);
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  }
}
function showQuizIntro(){
  setProg(1+slides.length);
  main.innerHTML = `<div class="eyebrow">Final Quiz</div>
    <h1>Ready, ${esc(empName.split(' ')[0])}?</h1>
    <p>10 questions. You need <b>8 correct (80%)</b> to pass. If you don't pass, review the material and retake it.</p>
    <button class="btn" id="goBtn">Begin Quiz</button>
    <button class="btn secondary" id="revBtn">Review Material First</button>`;
  document.getElementById('goBtn').addEventListener('click', ()=>{ showQuizQ(); window.scrollTo(0,0); });
  document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
}
function showQuizQ(){
  if (quizIdx >= quiz.length){ showResult(); return; }
  setProg(1+slides.length+quizIdx);
  const qq = quiz[quizIdx];
  main.innerHTML = `<div class="qnum">Question ${quizIdx+1} of ${quiz.length}</div>
    <h1 style="font-size:20px">${esc(qq.q)}</h1><div id="opts"></div>
    <button class="btn" id="subBtn" disabled>Submit Answer</button>`;
  const optsEl=document.getElementById('opts');
  let sel=-1;
  qq.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o;
    b.addEventListener('click', ()=>{ sel=i; [...optsEl.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel');
      document.getElementById('subBtn').disabled=false; });
    optsEl.appendChild(b);
  });
  document.getElementById('subBtn').addEventListener('click', ()=>{
    if (sel===qq.a) quizScore++;
    quizIdx++; showQuizQ(); window.scrollTo(0,0);
  });
}
function completionCode(){
  const d=new Date();
  const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  let h=0; const src=empName.toUpperCase()+ds+quizScore+'SUP';
  for (let i=0;i<src.length;i++){ h=((h<<5)-h+src.charCodeAt(i))|0; }
  const alpha="BCDFGHJKMNPQRSTVWXYZ23456789";
  let n=Math.abs(h), out="";
  for (let i=0;i<5;i++){ out+=alpha.charAt(n%alpha.length); n=Math.floor(n/alpha.length); }
  return 'WS26S-' + out;
}
function showResult(){
  setProg(totalSteps);
  const pct = Math.round(quizScore/quiz.length*100);
  const passed = pct >= 80;
  const dateStr = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  if (passed){
    main.innerHTML = `<div class="eyebrow">Training Complete</div><h1>Congratulations!</h1>
      <p style="text-align:center"><span class="score-pill">Score: ${pct}%</span></p>
      <div class="cert">
        <div class="eyebrow">Certificate of Completion</div>
        <div class="big">${esc(empName)}</div>
        <p>has completed <b>Wildfire Smoke SUPERVISOR Training</b><br>per OAR 437-002-1081</p>
        <p><b>${dateStr}</b> · Score: <b>${quizScore}/${quiz.length} (${pct}%)</b></p>
        <div class="code">${completionCode()}</div>
        <p style="font-size:13px;color:var(--gray)">Mt. Hood Forest Products LLC · Hood River, OR</p>
      </div>
      <div class="card"><b>Final step — record your completion:</b> Tap the button below to open the completion form. Select the module <b>Wildfire Smoke — Supervisor / Humo de Incendios Forestales — Supervisor</b>, enter today's date, your score, and the completion code above, then submit. Screenshot this screen for your own records. Your training is not documented until the form is submitted.</div>
      <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Record My Completion</a>`;
  } else {
    main.innerHTML = `<div class="eyebrow">Quiz Result</div><h1>Not Quite — Let's Try Again</h1>
      <p style="text-align:center"><span class="score-pill fail">Score: ${pct}%</span></p>
      <p>You need 80% to pass. Review the material and take the quiz again — your crew is counting on you knowing this cold.</p>
      <button class="btn" id="revBtn">Review Material</button>
      <button class="btn secondary" id="retryBtn">Retake Quiz Now</button>`;
    document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
    document.getElementById('retryBtn').addEventListener('click', ()=>{ quizIdx=0; quizScore=0; showQuizQ(); window.scrollTo(0,0); });
  }
}
window.APP = { slides, quiz, FORM_URL, completionCode, showStart,
  get state(){ return { empName, slideIdx, quizIdx, quizScore }; },
  setName(n){ empName = n; }, setScore(s){ quizScore = s; },
  showResult, showSlide, showQuizQ, showQuizIntro };
showStart();
</script>
</body>
</html>
