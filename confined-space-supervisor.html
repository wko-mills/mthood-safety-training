<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mt. Hood Forest Products — Confined Space SUPERVISOR Training v1.0</title>
<style>
  :root { --blue:#2E75B6; --dark:#1F4E79; --gray:#666; --light:#F2F2F2;
          --green:#2E8B57; --amber:#E8A317; --orange:#D2691E; --red:#B22222; --maroon:#701C1C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Arial,Helvetica,sans-serif; background:var(--light); color:#222; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:#fff; box-shadow:0 0 24px rgba(0,0,0,.08); }
  header { background:var(--dark); color:#fff; padding:14px 20px; }
  header .co { font-weight:bold; font-size:15px; letter-spacing:.5px; }
  header .prog { font-size:12px; color:#cfe0f0; }
  .badge { display:inline-block; background:var(--amber); color:#2b1c00; font-weight:bold; font-size:11px; letter-spacing:1px; padding:2px 8px; border-radius:999px; margin-top:5px; }
  .bar { height:6px; background:#dce7f2; } .bar span { display:block; height:100%; background:var(--blue); width:0%; transition:width .3s; }
  main { flex:1; padding:24px 20px 32px; }
  h1 { color:var(--dark); font-size:24px; margin-bottom:12px; }
  p { margin-bottom:12px; font-size:16px; }
  ul, ol { margin:0 0 12px 22px; } li { margin-bottom:7px; font-size:16px; }
  .eyebrow { text-transform:uppercase; letter-spacing:1.5px; font-size:11px; color:var(--gray); font-weight:bold; margin-bottom:6px; }
  .card { background:var(--light); border-left:4px solid var(--blue); padding:12px 14px; margin:14px 0; border-radius:0 6px 6px 0; font-size:15px; }
  .card.warn { border-left-color:var(--red); }
  .card.do { border-left-color:var(--green); }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:15px; font-size:17px; font-weight:bold; font-family:inherit; cursor:pointer; margin-top:18px; }
  .btn:active { background:var(--dark); } .btn:disabled { background:#b9c8d6; cursor:default; }
  .btn.secondary { background:#fff; color:var(--blue); border:2px solid var(--blue); }
  a.btn { text-decoration:none; text-align:center; box-sizing:border-box; }
  input[type=text] { width:100%; padding:13px; font-size:17px; font-family:inherit; border:2px solid #c6d4e2; border-radius:8px; margin-top:6px; }
  input[type=text]:focus { outline:none; border-color:var(--blue); }
  label { font-weight:bold; font-size:14px; color:var(--dark); }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid #c6d4e2; border-radius:8px; padding:13px 14px; font-size:16px; font-family:inherit; margin-top:10px; cursor:pointer; }
  .opt.sel { border-color:var(--blue); background:#eaf2fa; }
  .opt.right { border-color:var(--green); background:#e8f5ee; }
  .opt.wrong { border-color:var(--red); background:#fbeaea; }
  .feedback { margin-top:12px; padding:12px 14px; border-radius:8px; font-size:15px; display:none; }
  .feedback.good { background:#e8f5ee; border-left:4px solid var(--green); display:block; }
  .feedback.bad { background:#fbeaea; border-left:4px solid var(--red); display:block; }
  .qnum { font-size:12px; color:var(--gray); font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .cert { border:3px solid var(--dark); border-radius:10px; padding:22px; text-align:center; margin-top:16px; }
  .cert .big { font-size:22px; font-weight:bold; color:var(--dark); margin:8px 0; }
  .cert .code { font-size:26px; letter-spacing:3px; font-weight:bold; color:var(--blue); background:var(--light); border-radius:8px; padding:10px; margin:12px 0; }
  .score-pill { display:inline-block; background:var(--green); color:#fff; border-radius:999px; padding:6px 18px; font-weight:bold; font-size:18px; }
  .score-pill.fail { background:var(--red); }
  .steps { counter-reset:s; list-style:none; margin-left:0; }
  .steps li { counter-increment:s; position:relative; padding-left:34px; margin-bottom:10px; }
  .steps li:before { content:counter(s); position:absolute; left:0; top:1px; background:var(--blue); color:#fff; width:24px; height:24px; border-radius:50%; text-align:center; font-weight:bold; font-size:14px; line-height:24px; }
  table.mini { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; }
  table.mini th { background:var(--blue); color:#fff; padding:8px; text-align:left; }
  table.mini td { border:1px solid #d9e2ec; padding:8px; vertical-align:top; }
  table.mini tr:nth-child(even) td { background:var(--light); }
  footer { padding:12px 20px; font-size:11px; color:var(--gray); text-align:center; border-top:1px solid #e4e9ef; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="co">MT. HOOD FOREST PRODUCTS LLC</div>
    <div class="prog">Confined Space Training &mdash; OAR 437-002-0146 (Div 2-O)</div>
    <div class="badge">SUPERVISOR MODULE</div>
  </header>
  <div class="bar"><span id="prog"></span></div>
  <main id="main"></main>
  <footer>Mt. Hood Forest Products LLC · Hood River, OR · Confined Space Program v2.2 · Supervisor Module v1.0 (2026)</footer>
</div>
<script>
const FORM_URL = "https://forms.cloud.microsoft/r/weC1yEfgb7";
let empName = "", slideIdx = 0, quizIdx = 0, quizScore = 0;
const slides = [{"t": "content", "eyebrow": "Section 1 of 6", "title": "What This Module Covers", "html": "<p>This module carries the <b>Entry Supervisor</b> knowledge for confined space operations. It builds on the employee awareness module — complete that first.</p><div class='card warn'>Oregon has its <b>own</b> confined space rule, <b>OAR 437-002-0146</b> (Division 2-O) — not the federal 1910.146. It requires role-specific training and documented proficiency before an employee is first assigned confined space duties. Passing this quiz is one proficiency method, but it does not replace the hands-on training and simulated non-entry rescue delivered annually on our own equipment.</div><p><b>What you owe as an Entry Supervisor:</b></p><ul><li>Determine acceptable entry conditions and authorize entry by signing the permit</li><li>Verify all tests were conducted and all equipment is in place before approving</li><li>Verify rescue services are available and there is a means to contact them</li><li>Remove unauthorized individuals who enter or attempt to enter</li><li>Terminate the entry and cancel the permit when work is done or conditions change</li><li>Coordinate with contractors entering our spaces, including the post-work debrief</li></ul><div class='card warn'><b>Your signature is the gate.</b> Nobody enters a permit-required confined space without an Entry Supervisor signature on a completed permit. If you are not certain every condition is met, do not sign.</div>"}, {"t": "content", "eyebrow": "Section 2 of 6", "title": "The Permit and the Entry Packet", "html": "<p>A complete entry packet is verified <b>before any worker breaks the plane of the opening</b>. It carries the decision flow chart, the entry permit (or alternative-methods documentation with its pre-entry checklist), the gas-detector bump & calibration log, the rescue pre-plan and contact sheet, the training acknowledgment, and the field logs (entry roster and briefing, atmospheric monitoring log, sign-out and return register).</p><p><b>Permit rules you enforce:</b></p><ul><li>The permit is good for <b>one shift only</b> and carries an expiration time; update it for each shift.</li><li>The permit is <b>posted at the work site outside the space</b> for the duration of the entry.</li><li>You <b>terminate</b> the permit when the task is complete, or immediately when a condition appears that exceeds what the permit authorized.</li><li>Cancelled permits come back to you and are <b>retained at least one year</b>, reviewed as part of the annual program review.</li><li>Hot work inside the space requires a <b>separate hot work permit</b>, approved by you and attached to the entry permit.</li></ul><div class='card do'>Completed permits, alternative-methods documentation, and monitoring records go back to the Safety Office when the entry is finished. The sign-out and return register is what makes that traceable.</div>"}, {"t": "content", "eyebrow": "Section 3 of 6", "title": "Atmospheric Testing and Monitoring", "html": "<p>Atmospheric hazards are the leading cause of confined space deaths. Test <b>in this order</b>, from outside the space, lowering the probe slowly through the full depth and sampling at floor level (several dangerous gases are heavier than air):</p><ol><li><b>Oxygen content</b> — acceptable 19.5% to 23.5%</li><li><b>Flammable gases and vapors</b> — below 10% of the lower flammable limit</li><li><b>Potential toxic air contaminants</b> — below applicable permissible exposure limits</li></ol><p>Oregon's rule also recognizes a sawmill-specific hazard: a <b>combustible-dust atmosphere</b> that obscures vision at 5 feet or less.</p><p><b>Continuous monitoring</b> is required for the full duration of every permit entry — conditions change without warning from leaks, reactions, the work itself, or ventilation failure. The attendant watches the readings and records them at least hourly; any reading outside acceptable limits means <b>immediate evacuation</b>. Ventilation is hazard <b>control</b>, not elimination — monitoring continues with the blower running.</p><div class='card warn'><b>Instrument discipline:</b> bump test before each day of use and before every entry. If the bump test fails, the instrument is out of service until a full calibration passes. Log the date, instrument serial number, calibration-gas lot, and result.</div>"}, {"t": "check", "q": "What is the correct ORDER for pre-entry atmospheric testing?", "opts": ["Flammable, oxygen, toxic", "Oxygen, flammable, toxic", "Toxic, flammable, oxygen", "Any order, as long as all three are tested"], "a": 1, "why": "Oxygen first (many sensors depend on it and it defines the hazard), then flammable gases/vapors, then toxics. Test from outside, sampling at floor level for heavier-than-air gases."}, {"t": "content", "eyebrow": "Section 4 of 6", "title": "Rescue — Verify Before You Sign", "html": "<div class='card warn'><b>Our employees perform NON-ENTRY rescue only.</b> No employee enters a confined space to perform a rescue, under any circumstances. We keep no SCBA on site. Entry rescue is the fire department (Odell Fire Dept / 911).</div><p><b>Non-entry rescue setup:</b> each entrant wears a full-body harness with a retrieval line attached to a mechanical retrieval device or fixed anchor outside the space. <b>Mechanical retrieval equipment is required for vertical spaces deeper than 5 feet</b>, unless a retrieval line would create a greater hazard.</p><p><b>Entry rescue:</b> for any entry that could expose entrants to IDLH conditions, notify the fire department in advance and have them present for the duration. If they must leave during an IDLH-potential entry, entrants come out immediately and stay out until rescue coverage is restored. A posted phone number is not a rescue plan — complete the rescue pre-plan and contact sheet before entry.</p><div class='card warn'><b>Rescue currency:</b> everyone involved in confined space rescue — including non-entry rescue — must have practiced a rescue within the previous 12 months, and at least one on-site team member holds current first aid and CPR certification.</div><p>Brief every crew working near an entry: if someone goes down, they call 911 and keep others out. They do not go in — most confined-space deaths are would-be rescuers.</p>"}, {"t": "check", "q": "Mechanical retrieval equipment is required for vertical confined spaces deeper than:", "opts": ["3 feet", "5 feet", "10 feet", "15 feet"], "a": 1, "why": "For vertical permit spaces more than 5 feet deep, a full-body harness with a retrieval line to a mechanical device is required so the attendant can retrieve the entrant without entering — unless the line itself would create a greater hazard."}, {"t": "content", "eyebrow": "Section 5 of 6", "title": "Alternative Methods and Hazard Control", "html": "<p>Alternative methods let you enter a permit-required space <b>without a full permit</b> — but only under narrow, documented conditions. Monitoring and inspection data must support that the space can be maintained safe, <b>and</b> one of these is true:</p><ol><li>All hazards — atmospheric and physical — have been eliminated, making the space equivalent to a non-permit space; <b>or</b></li><li>All physical hazards are eliminated and a potential hazardous atmosphere is controlled by <b>continuous forced-air ventilation</b>, with monitoring proving it stays safe. If the ventilation stops, entrants must be able to exit safely.</li></ol><div class='card warn'>If you cannot answer YES to every item on the pre-entry checklist, STOP and use the full entry permit. Alternative-methods documentation must be completed and available to entrants before each entry. Any entry before hazards are eliminated — to collect data or apply controls — follows the full permit procedure.</div><p><b>Hazard control before any entry:</b> lock out/tag out all hazardous energy connected to the space (per our LOTO program and OAR 437-002-0154); isolate lines by blank, blind, disconnect, or cap; break couplings or remove drive belts where mechanical apparatus is present; remove product; and ventilate with forced-draft clean air blown <b>in</b>, running continuously for the entire entry.</p>"}, {"t": "content", "eyebrow": "Section 6 of 6", "title": "Contractors, Training, and Records", "html": "<p><b>Contractor coordination:</b> when a contractor will enter one of our confined spaces, as <b>host employer</b> we must inform them the workplace contains permit-required confined spaces and entry is allowed only when OAR 437-002-0146 is met; inform them of the hazards we've identified and provide our program information; <b>coordinate entry operations</b> when our people and theirs work in or near the space; and <b>debrief each other after the work</b> on any hazards confronted or created — a required step, not a courtesy.</p><div class='card'><b>Coordinate, do not prescribe.</b> We share hazards and coordinate timing; the contractor decides their own means and methods.</div><p><b>Training triggers:</b> before first assignment to confined space duties, and again on a change in duties, a permit-space hazard they have not been trained on, deviations from our procedures, or inadequate knowledge or use. Training must be in a language and vocabulary the employee understands — which is why the employee module is bilingual.</p><p><b>Records:</b> training records (name, dates, trainer, topics); cancelled permits (one year minimum, reviewed annually); calibration and bump-test records; annual program-review forms (three years minimum). Verify annually that the fire department remains willing and able to provide confined space entry rescue.</p>"}, {"t": "check", "q": "Under Oregon's confined space rule, what is required of the host employer and a contractor AFTER entry operations are complete?", "opts": ["The contractor files a copy of their permit with us", "Nothing — the duty ends when the work ends", "We inspect their equipment before they leave", "Both parties debrief each other on any hazards confronted or created during the entry"], "a": 3, "why": "A post-entry debrief between host and contractor on hazards confronted or created is a required step, so lessons and newly discovered hazards are shared. Coordination runs before, during, and after the entry."}];
const quiz = [{"q": "A worker needs to reach head-and-shoulders into a permit-required confined space for a dropped tool. What is required?", "opts": ["Nothing — the body is not fully inside", "A signed entry permit — entry occurs when any part of the body breaks the plane", "Verbal approval from the attendant", "A hot work permit"], "a": 1}, {"q": "The correct ORDER for pre-entry atmospheric testing is:", "opts": ["Flammable, oxygen, toxic", "Toxic, flammable, oxygen", "Oxygen, flammable, toxic", "Any order"], "a": 2}, {"q": "A bump test fails on the morning of a scheduled entry. What happens?", "opts": ["The instrument is out of service until a full calibration passes", "Use it — the last full calibration is still current", "Use it but record the failure", "Confirm with a second instrument and proceed"], "a": 0}, {"q": "Mechanical retrieval equipment is required for vertical confined spaces deeper than:", "opts": ["3 feet", "10 feet", "15 feet", "5 feet"], "a": 3}, {"q": "Which rule governs confined space entry in Oregon?", "opts": ["OAR 437-002-0146 (Oregon's own rule, Division 2-O)", "29 CFR 1910.146 directly", "A company policy only", "OAR 437-002-0134"], "a": 0}, {"q": "When a confined space is ventilated, continuous atmospheric monitoring:", "opts": ["Can stop once the blower runs", "Must continue — ventilation controls but does not eliminate the hazard", "Is needed only for the first 10 minutes", "Is optional"], "a": 1}, {"q": "Our employees' role in confined space rescue is:", "opts": ["Entry rescue with SCBA", "Whatever the attendant decides", "Non-entry (retrieval) rescue only; entry rescue is the fire department", "No role at all"], "a": 2}, {"q": "After entry operations, the host employer and contractor must:", "opts": ["Exchange insurance certificates", "Do nothing further", "Inspect each other's tools", "Debrief each other on hazards confronted or created"], "a": 3}, {"q": "The acceptable oxygen range for confined space entry is:", "opts": ["10%–30%", "Above 15%", "19.5%–23.5%", "Any level if the entrant feels fine"], "a": 2}, {"q": "A cancelled confined space permit is retained for at least:", "opts": ["One week", "One year, reviewed annually", "30 days", "It is discarded"], "a": 1}];
const main = document.getElementById('main');
const progEl = document.getElementById('prog');
const totalSteps = slides.length + quiz.length + 2;
function setProg(n){ progEl.style.width = Math.min(100, Math.round(n/totalSteps*100)) + '%'; }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showStart(){
  setProg(0);
  main.innerHTML = `
    <div class="eyebrow">Mt. Hood Forest Products LLC · Safety Department</div>
    <h1>Confined Space — Supervisor Training</h1>
    <p>Required Entry Supervisor training under OAR 437-002-0146 (Oregon's confined space rule, Division 2-O) and the Mt. Hood Forest Products Confined Space Program v2.2. About 15 minutes.</p>
    <div class="card warn"><b>Complete the employee Confined Space module first.</b> This module covers your additional duties as a supervisor — it does not replace the employee training, and both are required of you.</div>
    <div class="card">Pass the 10-question quiz with <b>80% or better</b> to finish. You'll get a completion code and a button to record it.</div>
    <label for="nm">Enter your full name to begin</label>
    <input type="text" id="nm" autocomplete="name" placeholder="First and last name">
    <button class="btn" id="startBtn" disabled>Start Supervisor Training</button>`;
  const nm=document.getElementById('nm'), b=document.getElementById('startBtn');
  nm.addEventListener('input', ()=>{ b.disabled = nm.value.trim().split(/\s+/).length < 2; });
  b.addEventListener('click', ()=>{ empName=nm.value.trim(); slideIdx=0; showSlide(); });
}
function showSlide(){
  if (slideIdx >= slides.length){ quizIdx=0; quizScore=0; showQuizIntro(); return; }
  setProg(1+slideIdx);
  const s = slides[slideIdx];
  if (s.t === 'content'){
    main.innerHTML = `<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1>${s.html}
      <button class="btn" id="nextBtn">Continue</button>`;
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  } else {
    main.innerHTML = `<div class="eyebrow">Knowledge Check</div><h1>Quick Question</h1><p><b>${esc(s.q)}</b></p>
      <div id="opts"></div><div class="feedback" id="fb"></div>
      <button class="btn" id="nextBtn" style="display:none">Continue</button>`;
    const optsEl=document.getElementById('opts');
    s.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt'; b.textContent=o;
      b.addEventListener('click', ()=>{
        const fb=document.getElementById('fb');
        [...optsEl.children].forEach(c=>c.disabled=true);
        if (i===s.a){ b.classList.add('right'); fb.className='feedback good'; fb.textContent=s.why;
          document.getElementById('nextBtn').style.display='block'; }
        else { b.classList.add('wrong'); fb.className='feedback bad'; fb.textContent='Not quite — take another look and try again.';
          setTimeout(()=>{ [...optsEl.children].forEach(c=>{c.disabled=false;c.classList.remove('wrong');}); fb.className='feedback'; },1600); }
      });
      optsEl.appendChild(b);
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  }
}
function showQuizIntro(){
  setProg(1+slides.length);
  main.innerHTML = `<div class="eyebrow">Final Quiz</div>
    <h1>Ready, ${esc(empName.split(' ')[0])}?</h1>
    <p>10 questions. You need <b>8 correct (80%)</b> to pass. If you don't pass, review the material and retake it.</p>
    <button class="btn" id="goBtn">Begin Quiz</button>
    <button class="btn secondary" id="revBtn">Review Material First</button>`;
  document.getElementById('goBtn').addEventListener('click', ()=>{ showQuizQ(); window.scrollTo(0,0); });
  document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
}
function showQuizQ(){
  if (quizIdx >= quiz.length){ showResult(); return; }
  setProg(1+slides.length+quizIdx);
  const qq = quiz[quizIdx];
  main.innerHTML = `<div class="qnum">Question ${quizIdx+1} of ${quiz.length}</div>
    <h1 style="font-size:20px">${esc(qq.q)}</h1><div id="opts"></div>
    <button class="btn" id="subBtn" disabled>Submit Answer</button>`;
  const optsEl=document.getElementById('opts');
  let sel=-1;
  qq.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o;
    b.addEventListener('click', ()=>{ sel=i; [...optsEl.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel');
      document.getElementById('subBtn').disabled=false; });
    optsEl.appendChild(b);
  });
  document.getElementById('subBtn').addEventListener('click', ()=>{
    if (sel===qq.a) quizScore++;
    quizIdx++; showQuizQ(); window.scrollTo(0,0);
  });
}
function completionCode(){
  const d=new Date();
  const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  let h=0; const src=empName.toUpperCase()+ds+quizScore+'SUP';
  for (let i=0;i<src.length;i++){ h=((h<<5)-h+src.charCodeAt(i))|0; }
  const alpha="BCDFGHJKMNPQRSTVWXYZ23456789";
  let n=Math.abs(h), out="";
  for (let i=0;i<5;i++){ out+=alpha.charAt(n%alpha.length); n=Math.floor(n/alpha.length); }
  return 'CS26S-' + out;
}
function showResult(){
  setProg(totalSteps);
  const pct = Math.round(quizScore/quiz.length*100);
  const passed = pct >= 80;
  const dateStr = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  if (passed){
    main.innerHTML = `<div class="eyebrow">Training Complete</div><h1>Congratulations!</h1>
      <p style="text-align:center"><span class="score-pill">Score: ${pct}%</span></p>
      <div class="cert">
        <div class="eyebrow">Certificate of Completion</div>
        <div class="big">${esc(empName)}</div>
        <p>has completed <b>Confined Space SUPERVISOR Training</b><br>per OAR 437-002-0146</p>
        <p><b>${dateStr}</b> · Score: <b>${quizScore}/${quiz.length} (${pct}%)</b></p>
        <div class="code">${completionCode()}</div>
        <p style="font-size:13px;color:var(--gray)">Mt. Hood Forest Products LLC · Hood River, OR</p>
      </div>
      <div class="card"><b>Final step — record your completion:</b> Tap the button below to open the completion form. Select the module <b>Confined Space — Supervisor / Espacio Confinado — Supervisor</b>, enter today's date, your score, and the completion code above, then submit. Screenshot this screen for your own records. Your training is not documented until the form is submitted.</div>
      <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Record My Completion</a>`;
  } else {
    main.innerHTML = `<div class="eyebrow">Quiz Result</div><h1>Not Quite — Let's Try Again</h1>
      <p style="text-align:center"><span class="score-pill fail">Score: ${pct}%</span></p>
      <p>You need 80% to pass. Review the material and take the quiz again — your crew is counting on you knowing this cold.</p>
      <button class="btn" id="revBtn">Review Material</button>
      <button class="btn secondary" id="retryBtn">Retake Quiz Now</button>`;
    document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
    document.getElementById('retryBtn').addEventListener('click', ()=>{ quizIdx=0; quizScore=0; showQuizQ(); window.scrollTo(0,0); });
  }
}
window.APP = { slides, quiz, FORM_URL, completionCode, showStart,
  get state(){ return { empName, slideIdx, quizIdx, quizScore }; },
  setName(n){ empName = n; }, setScore(s){ quizScore = s; },
  showResult, showSlide, showQuizQ, showQuizIntro };
showStart();
</script>
</body>
</html>
